# ─── Nginx Configuration — Angular SSR Reverse Proxy ─────────────────────────
# Archivo: /etc/nginx/sites-available/mifarma
# Habilitar: ln -s /etc/nginx/sites-available/mifarma /etc/nginx/sites-enabled/
# ─────────────────────────────────────────────────────────────────────────────

# ─── Upstream: PM2 cluster (Angular SSR en Puerto 4000) ──────────────────────
# Define el grupo de backends. PM2 en cluster mode inicia N workers en el
# mismo puerto gracias al load balancer interno de Node.js/cluster.
upstream angular_ssr {
    server 127.0.0.1:4000;
    keepalive 64;               # Conexiones keepalive al upstream
}

# ─── Rate Limiting ────────────────────────────────────────────────────────────
# Protege contra DDoS básico y bots agresivos
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# ─── HTTP → HTTPS Redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name mifarma.tudominio.com www.mifarma.tudominio.com;

    # Certbot: ruta para renovación automática de certificado Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás: redirige a HTTPS (301 permanente para SEO)
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ─── HTTPS + Reverse Proxy ────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mifarma.tudominio.com www.mifarma.tudominio.com;

    # ─── SSL (Certbot / Let's Encrypt) ───────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/mifarma.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mifarma.tudominio.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS (6 meses)
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    # ─── Seguridad ────────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content Security Policy (ajustar según necesidades reales)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com;" always;

    # ─── Gzip Compression ────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    gzip_min_length 1000;

    # ─── Assets Estáticos (Angular build output) ──────────────────────────
    # Servidos directamente por Nginx (mucho más eficiente que Node.js)
    # con cache agresivo (1 año) gracias al content hashing de Angular
    root /var/www/mifarma/dist/mifarma/browser;

    location ~* \.(js|css|woff2?|ttf|otf|eot|ico|webp|png|jpg|jpeg|gif|svg)$ {
        try_files $uri @ssr;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Proxy a Angular SSR ──────────────────────────────────────────────
    # Todo lo que no sea asset estático va a Node.js (SSR)
    location / {
        # Rate limiting
        limit_req zone=api_limit burst=50 nodelay;

        # Proxy headers
        proxy_pass         http://angular_ssr;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffer
        proxy_buffer_size    16k;
        proxy_buffers        4 32k;
        proxy_busy_buffers_size 64k;
    }

    # Fallback para try_files de assets
    location @ssr {
        proxy_pass http://angular_ssr;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ─── Logs ─────────────────────────────────────────────────────────────
    access_log /var/log/nginx/mifarma.access.log;
    error_log  /var/log/nginx/mifarma.error.log warn;
}
